server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the HTML shell so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # Aggressively cache hashed Vite build assets (filenames contain content hashes).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Engine instruments arrive over OTLP at the optional collector. Resolve lazily
    # so CPU-only deployments without a collector can still serve the dashboard.
    location = /engine-metrics {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $engine_metrics http://otel-collector:8889/metrics;
        proxy_pass $engine_metrics;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # API routes must reach the server; serving index.html here hides routing errors.
    location ~ ^/(api(?:/|$)|v1(?:/|$)|v1\.0(?:/|$)|health$|ready$|metrics$|openapi\.json$) {
        proxy_pass http://sharpai:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: serve index.html for any client-side route that doesn't match a file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic gzip compression for text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;
}
