name: Docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  dashboard-image:
    name: Build dashboard image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build (do not push) the dashboard image to validate the Dockerfile + production build.
      # Pushing to a registry and building the CUDA/CPU server images (native LLamaSharp) require
      # registry secrets and larger runners; wire those in once secrets are configured.
      - name: Build dashboard image
        run: docker build -t sharpai-dashboard:ci ./dashboard

  compose-validate:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker/compose.yaml
        run: docker compose -f docker/compose.yaml config -q

      - name: Validate docker/compose-cpu.yaml
        run: docker compose -f docker/compose-cpu.yaml config -q

      - name: Validate docker/compose-cuda.yaml
        run: docker compose -f docker/compose-cuda.yaml config -q
