name: Dashboard E2E

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: dashboard

jobs:
  playwright:
    name: Visual + a11y QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The config's webServer builds and previews the SPA, then the specs check landmarks, routing, theming,
      # horizontal-overflow, and axe accessibility across desktop/tablet/mobile in light and dark.
      - name: Run Playwright
        run: npm run e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard/playwright-report
          if-no-files-found: ignore
