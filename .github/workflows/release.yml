name: Release SDKs

# Publishes the three SDKs on a version tag. Each job runs its checks first and only publishes on a
# green result. Publishing is skipped automatically when the corresponding secret is absent, so the
# workflow is safe to run before credentials are configured. Configure these repository secrets:
#   NUGET_API_KEY   - nuget.org API key (C# SDK)
#   NPM_TOKEN       - npmjs.com automation token (JS SDK)
#   PYPI_API_TOKEN  - pypi.org API token (Python SDK)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  csharp:
    name: Publish C# SDK to NuGet
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build (gate)
        run: dotnet build sdk/csharp/src/SharpAI.Sdk/SharpAI.Sdk.csproj -c Release

      - name: Pack
        run: dotnet pack sdk/csharp/src/SharpAI.Sdk/SharpAI.Sdk.csproj -c Release --no-build -o artifacts

      - name: Push to NuGet
        if: ${{ env.NUGET_API_KEY != '' }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  javascript:
    name: Publish JS SDK to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json

      - name: Install
        run: npm ci

      - name: Test & build (gate)
        run: |
          npm test
          npm run build

      - name: Publish
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --access public

  python:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    env:
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test (gate)
        run: python -m unittest discover -s tests -v

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Publish
        if: ${{ env.TWINE_PASSWORD != '' }}
        run: python -m twine upload dist/*
