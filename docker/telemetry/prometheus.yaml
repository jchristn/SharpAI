# Prometheus scrape configuration for SharpAI.
#
# Two sources of metrics:
#   1. The OpenTelemetry Collector's Prometheus exposition (OTLP metrics pushed by the app).
#   2. The SharpAI server's own /metrics endpoint (Watson 7.2 in-process HTTP-server
#      metrics). Engine metrics arrive through the collector job.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'sharpai'
    metrics_path: /metrics
    static_configs:
      - targets: ['sharpai:8000']
        labels:
          service: 'sharpai'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
