# OpenTelemetry Collector configuration for SharpAI.
#
# Metrics + traces arrive over OTLP from the SharpAI server via Radiant. Logs are tailed from the server's rolling log files under /app/logs and shipped
# to Loki over OTLP-HTTP. Metrics are re-exposed for Prometheus to scrape on :8889.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog:
    include: [ /app/logs/*.log* ]
    include_file_path: true
    start_at: beginning

processors:
  batch: {}
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
      - key: service.name
        value: sharpai
        action: insert

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    add_metric_suffixes: true
    resource_to_telemetry_conversion:
      enabled: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [filelog]
      processors: [resource, memory_limiter, batch]
      exporters: [otlphttp/loki]
